name: CI

# Runs the Jest suite on every push and pull request. Branch protection on
# `main` uses the "test" job below as a required status check, so a PR can't be
# merged until these tests pass. See CLAUDE.md for what's under test (the
# Worker's /proxy contract + the single-file Vue app's logic).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref so a fresh push doesn't queue behind
# a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# checks:write lets dorny/test-reporter publish the per-test report as a Check
# run on the commit/PR; the defaults stay read-only.
permissions:
  contents: read
  checks: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Jest writes reports/junit.xml (see jest.config.js). `npm test` exits
      # non-zero on failure so the job still goes red — but the two steps below
      # run with `if: ${{ !cancelled() }}` so the report is published either way.
      - name: Run tests
        run: npm test

      # Detailed, per-test report as a Check run — visible next to the "test"
      # status check on the commit and in the PR's Checks tab.
      - name: Publish test report (Checks)
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Jest test report
          path: reports/junit.xml
          reporter: jest-junit

      # Same data rendered onto the Actions run's own summary page.
      - name: Write test report (run summary)
        if: ${{ !cancelled() }}
        run: node scripts/junit-to-summary.js
